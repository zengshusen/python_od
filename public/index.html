<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <style>
        body { font-family: serif; margin: 40px; }
        h1 { margin-bottom: 20px; }
        img { width: 250px; height: 200px; object-fit: cover; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 80px; }
        input[type="text"], input[type="email"] { width: 200px; padding: 5px; }
        hr { border: 0; border-top: 1px solid #ccc; margin: 20px 0; max-width: 400px; }
        button { padding: 8px 15px; background-color: #f0f0f0; border: 1px solid #ccc; cursor: pointer; }
        button:hover { background-color: #e0e0e0; }
        
        /* 针对纯文本展示的样式，加粗显示数据 */
        .data-display { font-weight: bold; }
    </style>
</head>
<body>

    <h1>User profile</h1>
    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60" alt="Dog Profile">

    <!-- ==================== 1. 视图模式 (默认显示) ==================== -->
    <div id="view-container">
        <div class="form-group">
            <span>Name: </span><span id="view-name" class="data-display"></span>
        </div>
        <hr>
        <div class="form-group">
            <span>Email: </span><span id="view-email" class="data-display"></span>
        </div>
        <hr>
        <div class="form-group">
            <span>Interests: </span><span id="view-interests" class="data-display"></span>
        </div>
        <hr>
        <!-- 点击这个按钮，隐藏当前视图，显示编辑框 -->
        <button onclick="switchToEditMode()">Edit Profile</button>
    </div>


    <!-- ==================== 2. 编辑模式 (默认隐藏 style="display: none") ==================== -->
    <div id="edit-container" style="display: none;">
        <div class="form-group">
            <label>Name: </label>
            <input type="text" id="input-name">
        </div>
        <hr>
        <div class="form-group">
            <label>Email: </label>
            <input type="email" id="input-email">
        </div>
        <hr>
        <div class="form-group">
            <label>Interests: </label>
            <input type="text" id="input-interests">
        </div>
        <hr>
        <!-- 点击更新后，保存数据并切回视图模式 -->
        <button onclick="updateProfile()">Update Profile</button>
    </div>

    <script>
        // 获取数据（初始化或更新后调用）
        async function fetchProfile() {
            try {
                const response = await fetch('/get-profile');
                const data = await response.json();
                
                if (data && data.name) {
                    // 1. 把数据填入“视图模式”的文本中
                    document.getElementById('view-name').textContent = data.name;
                    document.getElementById('view-email').textContent = data.email || '';
                    document.getElementById('view-interests').textContent = data.interests || '';
                    
                    // 2. 同时把数据填入“编辑模式”的输入框中，备用
                    document.getElementById('input-name').value = data.name;
                    document.getElementById('input-email').value = data.email || '';
                    document.getElementById('input-interests').value = data.interests || '';
                }
            } catch (error) {
                console.error("Error loading profile:", error);
            }
        }

        // 切换到：编辑模式
        function switchToEditMode() {
            document.getElementById('view-container').style.display = 'none'; // 隐藏纯文本
            document.getElementById('edit-container').style.display = 'block'; // 显示输入框
        }

        // 保存更新，并切回到：视图模式
        async function updateProfile() {
            const name = document.getElementById('input-name').value;
            const email = document.getElementById('input-email').value;
            const interests = document.getElementById('input-interests').value;

            try {
                // 发送数据到后端
                const response = await fetch('/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, interests: interests })
                });

                if (response.ok) {
                    // 数据库更新成功后，重新拉取最新数据
                    await fetchProfile();
                    
                    // 隐藏输入框，显示纯文本视图
                    document.getElementById('edit-container').style.display = 'none';
                    document.getElementById('view-container').style.display = 'block';
                }
            } catch (error) {
                console.error("Error updating profile:", error);
            }
        }

        // 页面刚打开时，自动去拉取一次数据
        fetchProfile();
    </script>
</body>
</html>
